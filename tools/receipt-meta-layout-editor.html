<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Meta Layout Editor</title>
  <style>
    :root { --stage-w: 250px; --stage-h: 120px; --blue: #2563eb; --ink: #1a1a2e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #111827; }
    .page { display: grid; grid-template-columns: minmax(320px, 1fr) 420px; gap: 24px; padding: 24px; min-height: 100vh; }
    .card { background: white; border: 1px solid #dde3ee; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
    .stage-wrap { padding: 24px; overflow: auto; }
    .stage-shell { display: inline-block; padding: 24px; background: #eef3ff; border-radius: 12px; }
    #stage { position: relative; width: var(--stage-w); height: var(--stage-h); background: white; border: 1px solid #94a3b8; overflow: hidden; }
    .layer { position: absolute; border: 1px dashed rgba(37,99,235,.55); background: rgba(37,99,235,.06); color: var(--ink); padding: 0 2px; cursor: move; user-select: none; white-space: nowrap; display: flex; align-items: center; }
    .layer.active { outline: 2px solid var(--blue); background: rgba(37,99,235,.12); }
    .layer[data-kind="value"] { color: #e05a00; }
    .handle { position: absolute; width: 10px; height: 10px; right: -5px; bottom: -5px; border-radius: 50%; background: var(--blue); cursor: nwse-resize; }
    .side { padding: 20px; min-width: 0; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #64748b; font-size: 13px; line-height: 1.5; }
    .controls { display: grid; gap: 12px; margin-top: 18px; }
    .row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 8px; align-items: center; }
    label { font-size: 12px; color: #475569; }
    input, textarea, select, button { font: inherit; }
    input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; background: #fff; }
    textarea { min-height: 210px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    button { border: 0; border-radius: 9px; padding: 9px 12px; background: #111827; color: white; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .hint { margin-top: 12px; padding: 10px; background: #f8fafc; border-radius: 10px; color: #475569; }
    @media (max-width: 860px) { .page { grid-template-columns: 1fr; padding: 12px; } .side { order: -1; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card stage-wrap">
      <div class="stage-shell">
        <div id="stage" aria-label="Receipt meta layout stage"></div>
      </div>
      <p class="hint">Drag boxes to align the receipt top-right meta area. Select a layer, then use numeric fields for precise placement.</p>
    </section>
    <aside class="card side">
      <h1>Receipt No / Date / Tel Layout</h1>
      <p>Export JSON and send it back to Codex. This editor only controls the generated receipt meta block.</p>
      <div class="controls">
        <div class="row"><label>Selected</label><select id="selected"></select><button class="secondary" id="reset">Reset</button></div>
        <div class="row"><label>X / Y</label><input id="x" type="number" /><input id="y" type="number" /></div>
        <div class="row"><label>W / H</label><input id="w" type="number" /><input id="h" type="number" /></div>
        <div class="row"><label>Font / Weight</label><input id="fontSize" type="number" /><input id="fontWeight" type="number" step="100" /></div>
        <div class="row"><label>Text</label><input id="text" style="grid-column: span 2" /></div>
        <div class="button-row">
          <button id="export">Export JSON</button>
          <button class="secondary" id="import">Import JSON</button>
          <button class="secondary" id="copy">Copy</button>
        </div>
        <textarea id="json" spellcheck="false"></textarea>
      </div>
    </aside>
  </main>
  <script>
    const defaultLayout = {
      schema: 'RECEIPT_META_ROW_LAYOUT',
      version: 1,
      stage: { width: 250, height: 120 },
      layers: {
        receiptNoLabel: { x: 8, y: 8, w: 34, h: 18, fontSize: 14, fontWeight: 400, text: 'No:' },
        receiptNoValue: { x: 45, y: 5, w: 92, h: 24, fontSize: 18, fontWeight: 400, text: '0010000' },
        dateLabel: { x: 8, y: 36, w: 42, h: 18, fontSize: 14, fontWeight: 400, text: 'Date:' },
        dateValue: { x: 55, y: 36, w: 95, h: 18, fontSize: 14, fontWeight: 400, text: '30/06/2026' },
        telLabel: { x: 8, y: 62, w: 32, h: 18, fontSize: 14, fontWeight: 400, text: 'Tél:' },
        telValue: { x: 45, y: 62, w: 170, h: 48, fontSize: 14, fontWeight: 400, text: '+224 622 05 71 47' }
      }
    };
    let layout = structuredClone(defaultLayout);
    let selectedKey = 'receiptNoLabel';
    const stage = document.getElementById('stage');
    const selected = document.getElementById('selected');
    const fields = ['x','y','w','h','fontSize','fontWeight','text'].reduce((acc, id) => ({ ...acc, [id]: document.getElementById(id) }), {});
    const json = document.getElementById('json');

    function render() {
      document.documentElement.style.setProperty('--stage-w', `${layout.stage.width}px`);
      document.documentElement.style.setProperty('--stage-h', `${layout.stage.height}px`);
      selected.innerHTML = Object.keys(layout.layers).map((key) => `<option value="${key}">${key}</option>`).join('');
      selected.value = selectedKey;
      stage.innerHTML = '';
      for (const [key, layer] of Object.entries(layout.layers)) {
        const div = document.createElement('div');
        div.className = `layer ${key === selectedKey ? 'active' : ''}`;
        div.dataset.key = key;
        div.dataset.kind = key.toLowerCase().includes('value') ? 'value' : 'label';
        Object.assign(div.style, {
          left: `${layer.x}px`, top: `${layer.y}px`, width: `${layer.w}px`, height: `${layer.h}px`,
          fontSize: `${layer.fontSize}px`, fontWeight: String(layer.fontWeight)
        });
        div.textContent = layer.text;
        const handle = document.createElement('span');
        handle.className = 'handle';
        div.appendChild(handle);
        stage.appendChild(div);
      }
      syncForm();
      syncJson();
    }
    function syncForm() {
      const layer = layout.layers[selectedKey];
      for (const key of Object.keys(fields)) fields[key].value = layer[key];
    }
    function syncJson() { json.value = JSON.stringify(layout, null, 2); }
    function updateSelected(patch) { Object.assign(layout.layers[selectedKey], patch); render(); }
    selected.addEventListener('change', () => { selectedKey = selected.value; render(); });
    for (const key of Object.keys(fields)) {
      fields[key].addEventListener('input', () => {
        const value = key === 'text' ? fields[key].value : Number(fields[key].value);
        updateSelected({ [key]: value });
      });
    }
    stage.addEventListener('pointerdown', (event) => {
      const target = event.target.closest('.layer');
      if (!target) return;
      selectedKey = target.dataset.key;
      const layer = layout.layers[selectedKey];
      const isResize = event.target.classList.contains('handle');
      const start = { x: event.clientX, y: event.clientY, layer: { ...layer } };
      target.setPointerCapture(event.pointerId);
      function move(e) {
        const dx = e.clientX - start.x;
        const dy = e.clientY - start.y;
        if (isResize) {
          layer.w = Math.max(8, Math.round(start.layer.w + dx));
          layer.h = Math.max(8, Math.round(start.layer.h + dy));
        } else {
          layer.x = Math.round(start.layer.x + dx);
          layer.y = Math.round(start.layer.y + dy);
        }
        render();
      }
      function up() {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      render();
    });
    document.getElementById('export').addEventListener('click', syncJson);
    document.getElementById('copy').addEventListener('click', async () => { syncJson(); await navigator.clipboard.writeText(json.value); });
    document.getElementById('reset').addEventListener('click', () => { layout = structuredClone(defaultLayout); selectedKey = 'receiptNoLabel'; render(); });
    document.getElementById('import').addEventListener('click', () => {
      const next = JSON.parse(json.value);
      if (next.schema !== 'RECEIPT_META_ROW_LAYOUT') throw new Error('Invalid schema');
      layout = next;
      selectedKey = Object.keys(layout.layers)[0];
      render();
    });
    render();
  </script>
</body>
</html>
