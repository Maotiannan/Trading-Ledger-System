services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://muledger:replace-with-your-password@192.168.1.3:3306/trading_ledger}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a non-placeholder value}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      ENABLE_INIT_ROUTE: ${ENABLE_INIT_ROUTE:-false}
      INIT_ADMIN_TOKEN: ${INIT_ADMIN_TOKEN:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      JSON_BODY_MAX_BYTES: ${JSON_BODY_MAX_BYTES:-262144}
      UPLOAD_BODY_MAX_BYTES: ${UPLOAD_BODY_MAX_BYTES:-10485760}
      MAINTENANCE_JOB_TOKEN: ${MAINTENANCE_JOB_TOKEN:?MAINTENANCE_JOB_TOKEN must be set to a non-placeholder value}
      MU_CONTRACT_SYNC_BASE_URL: ${MU_CONTRACT_SYNC_BASE_URL:-}
      MU_CONTRACT_SYNC_TOKEN: ${MU_CONTRACT_SYNC_TOKEN:-}
      UPLOADED_ASSET_STAGED_TTL_HOURS: ${UPLOADED_ASSET_STAGED_TTL_HOURS:-24}
      SIGNING_PENDING_TTL_HOURS: ${SIGNING_PENDING_TTL_HOURS:-72}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    volumes:
      - ${UPLOAD_HOST_DIR:-/Volumes/团队文件-DAINTY_SHIPMENT/docker/trading-ledger-system/upload}:/app/upload

  maintenance:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      MAINTENANCE_BASE_URL: ${MAINTENANCE_BASE_URL:-http://app:3000}
      MAINTENANCE_JOB_TOKEN: ${MAINTENANCE_JOB_TOKEN:?MAINTENANCE_JOB_TOKEN must be set to a non-placeholder value}
      MAINTENANCE_LOOP_SECONDS: ${MAINTENANCE_LOOP_SECONDS:-86400}
    command: >
      sh -c '
        while true; do
          until curl -fsS -X POST "$$MAINTENANCE_BASE_URL/api/internal/maintenance/uploaded-assets" \
            -H "x-maintenance-token: $$MAINTENANCE_JOB_TOKEN"; do
            sleep 30;
          done;
          sleep "$$MAINTENANCE_LOOP_SECONDS";
        done
      '

  mucontract-sync-trigger:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      MAINTENANCE_BASE_URL: ${MAINTENANCE_BASE_URL:-http://app:3000}
      MAINTENANCE_JOB_TOKEN: ${MAINTENANCE_JOB_TOKEN:?MAINTENANCE_JOB_TOKEN must be set to a non-placeholder value}
    command: >
      sh -c '
        while true; do
          curl -fsS -X POST "$$MAINTENANCE_BASE_URL/api/internal/integrations/mu-contract/pull" \
            -H "x-maintenance-token: $$MAINTENANCE_JOB_TOKEN" >/dev/null || true;
          sleep 5;
        done
      '

  email-delivery-trigger:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      MAINTENANCE_BASE_URL: ${MAINTENANCE_BASE_URL:-http://app:3000}
      MAINTENANCE_JOB_TOKEN: ${MAINTENANCE_JOB_TOKEN:?MAINTENANCE_JOB_TOKEN must be set to a non-placeholder value}
      EMAIL_DELIVERY_BATCH_SIZE: ${EMAIL_DELIVERY_BATCH_SIZE:-25}
      EMAIL_DELIVERY_LOOP_SECONDS: ${EMAIL_DELIVERY_LOOP_SECONDS:-30}
    command: >
      sh -c '
        while true; do
          curl -fsS -X POST "$$MAINTENANCE_BASE_URL/api/internal/email-delivery/dispatch" \
            -H "x-maintenance-token: $$MAINTENANCE_JOB_TOKEN" \
            -H "x-email-delivery-batch-size: $$EMAIL_DELIVERY_BATCH_SIZE" >/dev/null || true;
          sleep "$$EMAIL_DELIVERY_LOOP_SECONDS";
        done
      '

  caddy:
    image: caddy:2.8-alpine
    container_name: trading-ledger-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      CADDY_MAX_REQUEST_BODY_SIZE: ${CADDY_MAX_REQUEST_BODY_SIZE:-10MB}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - dainty_net

volumes:
  caddy_data:
  caddy_config:

networks:
  dainty_net:
    external: true
