services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://muledger:replace-with-your-password@192.168.1.3:3306/trading_ledger}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      ENABLE_INIT_ROUTE: ${ENABLE_INIT_ROUTE:-false}
      INIT_ADMIN_TOKEN: ${INIT_ADMIN_TOKEN:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      JSON_BODY_MAX_BYTES: ${JSON_BODY_MAX_BYTES:-262144}
      UPLOAD_BODY_MAX_BYTES: ${UPLOAD_BODY_MAX_BYTES:-10485760}
    volumes:
      - upload_data:/app/upload

  caddy:
    image: caddy:2.8-alpine
    container_name: trading-ledger-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      CADDY_MAX_REQUEST_BODY_SIZE: ${CADDY_MAX_REQUEST_BODY_SIZE:-10MB}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - dainty_net

volumes:
  upload_data:
  caddy_data:
  caddy_config:

networks:
  dainty_net:
    external: true
