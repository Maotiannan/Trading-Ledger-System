services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/trading_ledger?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      ENABLE_INIT_ROUTE: ${ENABLE_INIT_ROUTE:-false}
      INIT_ADMIN_TOKEN: ${INIT_ADMIN_TOKEN:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
    volumes:
      - upload_data:/app/upload

  caddy:
    image: caddy:2.8-alpine
    container_name: trading-ledger-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - dainty_net

volumes:
  postgres_data:
  upload_data:
  caddy_data:
  caddy_config:

networks:
  dainty_net:
    external: true
