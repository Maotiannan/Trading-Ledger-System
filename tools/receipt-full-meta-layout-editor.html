<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MU Ledger - Full Receipt Meta Layout Editor</title>
  <style>
    :root { color-scheme: light; --blue: #2458d6; --ink: #1a1a2e; --panel: #f5f7fb; --line: #d8deea; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e8edf5; color: var(--ink); font: 14px/1.45 Georgia, "Times New Roman", serif; }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 100vh; }
    .workspace { min-width: 0; padding: 20px; overflow: auto; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .toolbar strong { margin-right: auto; font-size: 17px; }
    .toolbar label { display: flex; align-items: center; gap: 8px; }
    .toolbar input[type="range"] { width: 150px; }
    .stage-viewport { min-width: 100%; min-height: calc(100vh - 80px); display: grid; place-items: start center; }
    .stage-size { position: relative; }
    #stage { position: absolute; inset: 0 auto auto 0; width: 720px; height: 507px; transform-origin: top left; background: white; box-shadow: 0 16px 42px rgba(27, 39, 63, .2); overflow: hidden; }
    #background { position: absolute; inset: 0; width: 720px; height: 507px; user-select: none; pointer-events: none; }
    .layer { position: absolute; display: flex; align-items: flex-start; white-space: nowrap; overflow: visible; color: var(--ink); font-family: "Times New Roman", serif; line-height: 1; cursor: move; user-select: none; touch-action: none; outline: 1px dashed transparent; }
    .layer:hover { outline-color: rgba(36, 88, 214, .45); background: rgba(36, 88, 214, .04); }
    .layer.selected { outline: 2px solid var(--blue); background: rgba(36, 88, 214, .08); z-index: 2; }
    .layer.receipt-number { color: #e05a00; }
    .resize-handle { position: absolute; width: 12px; height: 12px; right: -6px; bottom: -6px; border: 2px solid white; border-radius: 50%; background: var(--blue); cursor: nwse-resize; display: none; }
    .layer.selected .resize-handle { display: block; }
    .panel { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 20px; background: white; border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(27, 39, 63, .06); }
    .panel h1 { margin: 0 0 4px; font-size: 20px; }
    .panel p { margin: 0 0 16px; color: #596579; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 5px; color: #465166; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
    .field select, .field input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: white; padding: 8px 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    button { border: 1px solid var(--blue); border-radius: 7px; padding: 8px 10px; background: var(--blue); color: white; cursor: pointer; }
    button.secondary { background: white; color: var(--blue); }
    textarea { min-height: 230px; resize: vertical; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #status { min-height: 20px; margin-top: 8px; color: #237447; font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .locked { color: #6b7280; font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .panel { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
      .stage-viewport { min-height: 560px; }
    }
  </style>
</head>
<body>

    <section class="workspace">
      <div class="toolbar">
        <strong>完整收据预览 / Full Receipt Preview</strong>
        <span class="locked">背景已锁定，只能调整 No / Date / Tél</span>
        <label>缩放 <input id="zoom" type="range" min="50" max="130" step="5" value="100"><output id="zoomValue">100%</output></label>
        <button class="secondary" id="fit">适配窗口</button>
      </div>
      <div class="stage-viewport" id="stageViewport">
        <div class="stage-size" id="stageSize">

    <aside class="panel">
      <h1>No / Date / Tél 布局</h1>
      <p>拖动蓝框或修改数值。导出的坐标直接对应整张 720px 收据。</p>
      <div class="field">
        <label for="selected">选择图层 / Selected layer</label>
        <select id="selected"></select>
      </div>
      <div class="grid">
        <div class="field"><label for="x">X</label><input id="x" type="number" step="1"></div>
        <div class="field"><label for="y">Y</label><input id="y" type="number" step="1"></div>
        <div class="field"><label for="w">Width</label><input id="w" type="number" min="8" step="1"></div>
        <div class="field"><label for="h">Height</label><input id="h" type="number" min="8" step="1"></div>
        <div class="field"><label for="fontSize">Font size</label><input id="fontSize" type="number" min="6" max="48" step="1"></div>
        <div class="field"><label for="fontWeight">Font weight</label><input id="fontWeight" type="number" min="100" max="900" step="100"></div>
      </div>
      <div class="actions">
        <button id="export">导出 JSON</button>
        <button class="secondary" id="copy">复制 JSON</button>
        <button class="secondary" id="import">导入 JSON</button>
        <button class="secondary" id="reset">重置</button>
      </div>
      <div class="field">
        <label for="json">Layout JSON</label>
        <textarea id="json" spellcheck="false"></textarea>
      </div>
      <div id="status" role="status"></div>
    </aside>
  </main>

  <script>
    const STAGE_WIDTH = 720;
    const STAGE_HEIGHT = 507;
    const requiredLayerKeys = [
      'receiptNoLabel', 'receiptNoValue', 'dateLabel',
      'dateValue', 'telLabel', 'telValue'
    ];
    const layerLabels = {
      receiptNoLabel: 'No label',
      receiptNoValue: 'Receipt No value',
      dateLabel: 'Date label',
      dateValue: 'Date value',
      telLabel: 'Tél label',
      telValue: 'Telephone value'
    };
    const defaultLayout = {
      schema: 'RECEIPT_META_ABSOLUTE_LAYOUT',
      version: 1,
      stage: { width: STAGE_WIDTH, height: STAGE_HEIGHT },
      layers: {
        receiptNoLabel: { x: 490, y: 72, w: 34, h: 18, fontSize: 14, fontWeight: 400, text: 'No:' },
        receiptNoValue: { x: 530, y: 69, w: 92, h: 24, fontSize: 18, fontWeight: 400, text: '0010000' },
        dateLabel: { x: 490, y: 92, w: 42, h: 18, fontSize: 14, fontWeight: 400, text: 'Date:' },
        dateValue: { x: 537, y: 92, w: 95, h: 22, fontSize: 14, fontWeight: 400, text: '30/06/2026' },
        telLabel: { x: 490, y: 112, w: 32, h: 18, fontSize: 14, fontWeight: 400, text: 'Tél:' },
        telValue: { x: 530, y: 112, w: 187, h: 22, fontSize: 14, fontWeight: 400, text: '+224 622 05 71 47' }
      }
    };

    const clone = (value) => JSON.parse(JSON.stringify(value));
    let layout = clone(defaultLayout);
    let selectedKey = 'receiptNoLabel';
    let scale = 1;

    const stage = document.getElementById('stage');
    const stageSize = document.getElementById('stageSize');
    const selected = document.getElementById('selected');
    const json = document.getElementById('json');
    const status = document.getElementById('status');
    const fields = ['x', 'y', 'w', 'h', 'fontSize', 'fontWeight'];

    function clampLayer(layer) {
      layer.w = Math.max(8, Math.min(Number(layer.w) || 8, STAGE_WIDTH));
      layer.h = Math.max(8, Math.min(Number(layer.h) || 8, STAGE_HEIGHT));
      layer.x = Math.max(0, Math.min(Number(layer.x) || 0, STAGE_WIDTH - layer.w));
      layer.y = Math.max(0, Math.min(Number(layer.y) || 0, STAGE_HEIGHT - layer.h));
      layer.fontSize = Math.max(6, Math.min(Number(layer.fontSize) || 14, 48));
      layer.fontWeight = Math.max(100, Math.min(Number(layer.fontWeight) || 400, 900));
    }

    function syncStageScale() {
      stage.style.transform = `scale(${scale})`;
      stageSize.style.width = `${STAGE_WIDTH * scale}px`;
      stageSize.style.height = `${STAGE_HEIGHT * scale}px`;
      document.getElementById('zoom').value = String(Math.round(scale * 100));
      document.getElementById('zoomValue').value = `${Math.round(scale * 100)}%`;
    }

    function syncJson() {
      json.value = JSON.stringify(layout, null, 2);
    }

    function syncFields() {
      const layer = layout.layers[selectedKey];
      fields.forEach((key) => { document.getElementById(key).value = layer[key]; });
      selected.value = selectedKey;
    }

    function render() {
      stage.querySelectorAll('.layer').forEach((node) => node.remove());
      requiredLayerKeys.forEach((key) => {
        const layer = layout.layers[key];
        clampLayer(layer);
        const node = document.createElement('div');
        node.className = `layer ${key === selectedKey ? 'selected' : ''} ${key === 'receiptNoValue' ? 'receipt-number' : ''}`;
        node.dataset.key = key;
        node.style.left = `${layer.x}px`;
        node.style.top = `${layer.y}px`;
        node.style.width = `${layer.w}px`;
        node.style.height = `${layer.h}px`;
        node.style.fontSize = `${layer.fontSize}px`;
        node.style.fontWeight = layer.fontWeight;
        node.textContent = layer.text;
        const handle = document.createElement('span');
        handle.className = 'resize-handle';
        handle.dataset.resize = 'true';
        node.appendChild(handle);
        stage.appendChild(node);
      });
      syncFields();
      syncJson();
      syncStageScale();
    }

    requiredLayerKeys.forEach((key) => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = layerLabels[key];
      selected.appendChild(option);
    });

    selected.addEventListener('change', () => {
      selectedKey = selected.value;
      render();
    });

    fields.forEach((key) => {
      document.getElementById(key).addEventListener('input', (event) => {
        layout.layers[selectedKey][key] = Number(event.target.value);
        clampLayer(layout.layers[selectedKey]);
        render();
      });
    });

    stage.addEventListener('pointerdown', (event) => {
      const node = event.target.closest('.layer');
      if (!node) return;
      event.preventDefault();
      selectedKey = node.dataset.key;
      const layer = layout.layers[selectedKey];
      const resizing = event.target.dataset.resize === 'true';
      const start = { clientX: event.clientX, clientY: event.clientY, x: layer.x, y: layer.y, w: layer.w, h: layer.h };
      node.setPointerCapture?.(event.pointerId);
      render();

      const move = (moveEvent) => {
        const dx = (moveEvent.clientX - start.clientX) / scale;
        const dy = (moveEvent.clientY - start.clientY) / scale;
        if (resizing) {
          layer.w = start.w + dx;
          layer.h = start.h + dy;
        } else {
          layer.x = start.x + dx;
          layer.y = start.y + dy;
        }
        clampLayer(layer);
        render();
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        setStatus('位置已更新 / Position updated');
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up, { once: true });
    });

    document.getElementById('zoom').addEventListener('input', (event) => {
      scale = Number(event.target.value) / 100;
      syncStageScale();
    });

    document.getElementById('fit').addEventListener('click', () => {
      const available = Math.max(320, document.getElementById('stageViewport').clientWidth - 20);
      scale = Math.min(1, available / STAGE_WIDTH);
      syncStageScale();
    });

    function validateLayout(candidate) {
      if (!candidate || candidate.schema !== 'RECEIPT_META_ABSOLUTE_LAYOUT' || candidate.version !== 1) {
        throw new Error('Invalid schema or version');
      }
      if (candidate.stage?.width !== STAGE_WIDTH || candidate.stage?.height !== STAGE_HEIGHT) {
        throw new Error('Stage must be 720 x 507');
      }
      requiredLayerKeys.forEach((key) => {
        if (!candidate.layers?.[key]) throw new Error(`Missing layer: ${key}`);
      });
      return candidate;
    }

    function setStatus(message, error = false) {
      status.textContent = message;
      status.style.color = error ? '#b42318' : '#237447';
    }

    document.getElementById('export').addEventListener('click', () => {
      syncJson();
      setStatus('JSON 已导出 / JSON exported');
    });

    document.getElementById('copy').addEventListener('click', async () => {
      syncJson();
      try {
        await navigator.clipboard.writeText(json.value);
      } catch {
        json.focus();
        json.select();
        document.execCommand('copy');
      }
      setStatus('JSON 已复制 / JSON copied');
    });

    document.getElementById('import').addEventListener('click', () => {
      try {
        layout = clone(validateLayout(JSON.parse(json.value)));
        requiredLayerKeys.forEach((key) => clampLayer(layout.layers[key]));
        render();
        setStatus('JSON 已导入 / JSON imported');
      } catch (error) {
        setStatus(`导入失败 / Import failed: ${error.message}`, true);
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      layout = clone(defaultLayout);
      selectedKey = 'receiptNoLabel';
      scale = 1;
      render();
      setStatus('已重置 / Reset complete');
    });

    render();
    requestAnimationFrame(() => document.getElementById('fit').click());
  </script>
</body>
</html>
